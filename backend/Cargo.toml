[package]
name = "backend"
authors = ["Frederik Enste <frederik@fenste.de>"]
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
publish = false

[dependencies]
anyhow = "1.0.102"
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.1", features = ["cargo", "derive", "env"] }
encoding_rs = "0.8.35"
hf-hub = "0.5.0"
hound = "3.5.1"
futures-util = "0.3.32"
llama-cpp-2 = { version = "0.1.146", features = ["cuda"] }
qwen3-tts = { git = "https://github.com/suniastar/qwen3-tts-rs.git", rev = "66b4ecd06d7ffc00e5eaabc67b9903628a602547", features = ["cuda", "flash-attn"] }
rand = "0.10.1"
reqwest = "0.12.28"
rmp-serde = "1.3.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["rt-multi-thread"] }
tokio-tungstenite = { version = "0.29.0", features = ["native-tls"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
twitch_api = { version = "0.7.2", features = ["eventsub", "helix", "reqwest"] }
