[package]
name = "backend"
authors = ["Frederik Enste <frederik@fenste.de>"]
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
publish = false

[dependencies]
anyhow = "1.0.102"
axum = { version = "0.8.9", features = ["ws"] }
candle-core = { workspace = true, features = ["cuda", "cudnn"] }
candle-transformers = { workspace = true, features = ["cuda", "cudnn"] }
clap = { version = "4.6.1", features = ["cargo", "derive", "env"] }
hf-hub = "0.5.0"
futures-util = "0.3.32"
qwen3-tts = { workspace = true, features = ["cuda", "flash-attn"] }
rand = "0.10.1"
reqwest = "0.13.4"
rmp-serde = "1.3.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
time = {version = "0.3.47", features = ["formatting"]}
tokenizers = "0.22.2"
tokio = { version = "1.52.3", features = ["rt-multi-thread"] }
tokio-tungstenite = { version = "0.29.0", features = ["native-tls"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
twitch_api = { version = "0.8.0", features = ["eventsub", "helix", "reqwest"] }
voice = {workspace = true}