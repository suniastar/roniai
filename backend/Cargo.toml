[package]
name = "backend"
authors = ["Frederik Enste <frederik@fenste.de>"]
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
publish = false

[dependencies]
anyhow = "1.0.102"
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.1", features = ["cargo", "derive", "env"] }
futures-util = "0.3.32"
reqwest = "0.12.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.33"
tokio = { version = "1.48.0", features = ["rt-multi-thread"] }
tokio-tungstenite = { version = "0.29.0", features = ["native-tls"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
twitch_api = { version = "0.7.2", features = ["eventsub", "helix", "reqwest"] }
