[workspace]
resolver = "3"
members = [
    "backend",
    "voice",
]

[profile.release]
lto = true

[profile.profiling]
inherits = "release"
debug = true

[workspace.dependencies]
candle-core = "0.10.2"
candle-flash-attn = "0.10.2"
candle-kernels = "0.10.2"
candle-nn = "0.10.2"
candle-transformers = "0.10.2"
candle-ug = "0.10.2"
qwen3-tts = { git = "https://github.com/suniastar/qwen3-tts-rs.git", rev = "025332bdae37609ad2930d0862cd068cd2054165" }
voice = { path = "./voice" }

[patch.crates-io]
candle-core = { git = "https://github.com/suniastar/candle", rev = "9f8bdd442bdddf6d0593148576677fc844c1dee7" }
candle-kernels = { git = "https://github.com/suniastar/candle", rev = "9f8bdd442bdddf6d0593148576677fc844c1dee7" }
candle-nn = { git = "https://github.com/suniastar/candle", rev = "9f8bdd442bdddf6d0593148576677fc844c1dee7" }
candle-transformers = { git = "https://github.com/suniastar/candle", rev = "9f8bdd442bdddf6d0593148576677fc844c1dee7" }
candle-ug = { git = "https://github.com/suniastar/candle", rev = "9f8bdd442bdddf6d0593148576677fc844c1dee7" }
